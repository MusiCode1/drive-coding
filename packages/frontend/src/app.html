<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>drive-coding</title>
    <!-- Log config — runs synchronously before any bundle loads -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        function pick(k, ls) {
          var v = p.get(k);
          if (v != null) {
            if (p.get('logSticky') === '1') localStorage.setItem(ls, v);
            return v;
          }
          return localStorage.getItem(ls);
        }
        // ?wire=1|acp|ws — shortcut for wire-level tracing
        var wire = p.get('wire') || localStorage.getItem('LOG_WIRE');
        window.__LOG__ = {
          level: pick('log', 'LOG_LEVEL') || (wire ? 'trace' : 'info'),
          ns: pick('logNs', 'LOG_NS') || (wire === '1' ? 'fe.ws.wire.*' :
                                          wire === 'ws' ? 'fe.ws.wire.*' : '*'),
          format: pick('logFormat', 'LOG_FORMAT') || 'pretty',
          remote: pick('logRemote', 'LOG_REMOTE') === '1',
        };
      })();
    </script>
    <!-- Lucide icons (data-lucide attribute API) -->
    <script defer src="https://unpkg.com/lucide@0.474.0"></script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
