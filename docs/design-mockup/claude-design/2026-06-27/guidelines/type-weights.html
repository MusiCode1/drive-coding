<!-- @dsCard group="Type" viewport="700x230" name="Heebo — Weights" subtitle="The primary Hebrew + Latin typeface, 300–800" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .w { font-size: 26px; color: var(--fg); flex: 1; }
  .t { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); direction: ltr; }
</style>
</head>
<body>
  <div class="row"><span class="w" style="font-weight:300">קוד נהיגה · drive</span><span class="t">300 light</span></div>
  <div class="row"><span class="w" style="font-weight:400">קוד נהיגה · drive</span><span class="t">400 regular</span></div>
  <div class="row"><span class="w" style="font-weight:500">קוד נהיגה · drive</span><span class="t">500 medium</span></div>
  <div class="row"><span class="w" style="font-weight:600">קוד נהיגה · drive</span><span class="t">600 semibold</span></div>
  <div class="row"><span class="w" style="font-weight:700">קוד נהיגה · drive</span><span class="t">700 bold</span></div>
  <div class="row" style="border:none"><span class="w" style="font-weight:800">קוד נהיגה · drive</span><span class="t">800 extrabold</span></div>
</body>
</html>
