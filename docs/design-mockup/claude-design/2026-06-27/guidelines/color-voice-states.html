<!-- @dsCard group="Colors" viewport="700x160" name="Voice State Colors" subtitle="Semantic colors for the mic state machine and tool dots" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 150px; height: 56px; border-radius: var(--radius-md); display: grid; place-items: center; font-family: var(--font); font-weight: 700; font-size: 13px; color: #16130f; }
  .nm { font-family: var(--font); font-size: 12px; color: var(--fg); font-weight: 600; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--recording)">recording</div><div class="nm">recording</div><div class="lbl">#ff5a5a</div></div>
    <div class="sw"><div class="chip" style="background:var(--thinking)">thinking</div><div class="nm">thinking</div><div class="lbl">#c98bff</div></div>
    <div class="sw"><div class="chip" style="background:var(--speaking)">speaking</div><div class="nm">speaking</div><div class="lbl">#f0b65c</div></div>
  </div>
</body>
</html>
