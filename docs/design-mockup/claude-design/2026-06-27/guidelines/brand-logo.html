<!-- @dsCard group="Brand" viewport="700x200" name="App Icon & Logo" subtitle="Copper play-triangle + voice waveform on near-black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; align-items: center; gap: 28px; }
  img { display: block; }
  .meta { font-family: var(--font); }
  .nm { font-size: 20px; font-weight: 800; color: var(--fg); letter-spacing: -0.01em; }
  .tag { font-size: 13px; color: var(--fg-dim); margin-top: 4px; max-width: 320px; line-height: 1.5; }
  .marks { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
  .marks img { border-radius: 12px; }
</style>
</head>
<body>
  <img src="../assets/logo-icon-512.png" width="120" height="120" style="border-radius:26px" alt="DriveCoding app icon" />
  <div class="meta">
    <div class="nm">DriveCoding</div>
    <div class="tag">Voice-first, hands-free interface for ACP-compatible CLI agents. The mark fuses a play triangle (run) with a voice waveform (speak).</div>
    <div class="marks">
      <img src="../assets/logo-icon-192.png" width="48" height="48" alt="" />
      <img src="../assets/favicon-64.png" width="32" height="32" alt="" />
      <img src="../assets/apple-touch-icon.png" width="32" height="32" alt="" />
    </div>
  </div>
</body>
</html>
