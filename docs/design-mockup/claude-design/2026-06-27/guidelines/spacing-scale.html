<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base — chat gap is space-3 (12px)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { height: 14px; background: var(--accent); border-radius: 3px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); width: 120px; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">space-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">space-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lbl">space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">space-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">space-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">space-12 · 48</span><div class="bar" style="width:48px"></div></div>
</body>
</html>
