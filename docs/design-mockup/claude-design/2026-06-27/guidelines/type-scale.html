<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="UI is dense, voice-first — body sits at 14px" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; }
  .s { color: var(--fg); flex: 1; }
  .t { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); direction: ltr; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><span class="s" style="font-size:var(--text-3xl);font-weight:700">סוכן חדש</span><span class="t">3xl · 36px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-2xl);font-weight:600">חיבור לסוכן</span><span class="t">2xl · 25.6px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-xl);font-weight:600">כותרת מקטע</span><span class="t">xl · 21.6px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-lg)">כותרת כרטיס</span><span class="t">lg · 17.6px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-base)">טקסט בועה / גוף</span><span class="t">base · 14px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-sm);color:var(--fg-dim)">טקסט משני / כלי</span><span class="t">sm · 13px</span></div>
  <div class="row"><span class="s" style="font-size:var(--text-xs);color:var(--fg-muted)">חותמת זמן / תווית</span><span class="t">xs · 11.2px</span></div>
</body>
</html>
