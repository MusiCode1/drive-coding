<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DriveCoding — Redesign Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #e7e7e4; font-family: "Heebo", system-ui, sans-serif; }
  .canvas { width: max-content; min-width: 100%; min-height: 100vh; padding: 48px; box-sizing: border-box; }
  .head { max-width: 760px; margin-bottom: 8px; }
  .head h1 { font-size: 26px; font-weight: 800; color: #1a1a1c; margin: 0 0 6px; letter-spacing: -0.01em; }
  .head p { font-size: 14px; color: #5c5c63; margin: 0; line-height: 1.6; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 22px 0 34px; padding: 14px 18px; background: #fff; border: 1px solid #d8d8d4; border-radius: 12px; width: max-content; }
  .legend .li { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: #2a2a2c; }
  .legend .dot { width: 11px; height: 11px; border-radius: 50%; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .frame { flex: none; width: 360px; }
  .frame > .lbl { margin-bottom: 12px; }
  .frame .lbl b { display: block; font-size: 15px; font-weight: 700; color: #1a1a1c; }
  .frame .lbl span { font-size: 12.5px; color: #6a6a70; }
  .bezel { width: 360px; height: 740px; border-radius: 38px; padding: 11px; background: #0a0a0a; box-shadow: 0 24px 60px rgba(0,0,0,0.28); }
  .screen { width: 100%; height: 100%; border-radius: 28px; overflow: hidden; }
  .ctrls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .ctrls button { font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid #cfcfca; background: #fff; color: #3a3a3c; cursor: pointer; }
  .ctrls button[data-on="1"] { background: #1a1a1c; color: #fff; border-color: #1a1a1c; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes orbBreath { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: .75; } }
  @keyframes haloBreath { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes barPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes ringPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 30%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <h1>DriveCoding — תכנון מחדש</h1>
    <p>ארבעה כיוונים לצד מסך הצ'אט החי. הצבע שמור למשמעות: כרום נייטרלי, וצבע מופיע רק כדי לקודד את מצב הסוכן. כל מסגרת אינטראקטיבית — החליפי מצב כדי לראות את שפת-המצב, את לחצן "עצור ריצה", ואת נגן ההקראה.</p>
  </div>

  <div class="legend" id="legend"></div>

  <div class="row" id="row"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="redesign-shared.jsx"></script>
<script type="text/babel" src="redesign-frames.jsx"></script>
<script type="text/babel" src="redesign-app.jsx"></script>
</body>
</html>
