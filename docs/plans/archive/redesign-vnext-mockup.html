<!doctype html>
<html lang="he" dir="rtl" data-palette="ember">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>drive-coding — מוקאפ vNext (מפורק לקומפוננטות)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    /* ──────────────────────────────────────────────────────────────────
       Design tokens — 4 palettes. נבחרים דרך [data-palette] על <html>.
       מה שנבחר כאן יעבור כמעט copy-paste ל-app.css האמיתי (@theme).
       ────────────────────────────────────────────────────────────────── */
    @layer base {
      :root {
        color-scheme: dark;
        --radius: 14px;
        --font: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* ── 1. EMBER — חם, אנושי, נחושת/טרקוטה ───────────────────────── */
      [data-palette="ember"] {
        --bg:          #16130f;
        --bg-elev:     #211c16;
        --bg-card:     #2a231b;
        --fg:          #f0e9e1;
        --fg-dim:      #b3a596;
        --fg-muted:    #7d7064;
        --border:      rgba(255,240,225,0.08);
        --border-str:  rgba(255,240,225,0.16);
        --accent:      #e8845c;
        --accent-hi:   #f29b78;
        --accent-soft: rgba(232,132,92,0.15);
        --bubble-user: #2f2419;
        --bubble-agent:#241d2a;
        --recording:   #ff5a5a;
        --thinking:    #c98bff;
        --speaking:    #f0b65c;
      }

      /* ── 2. FOREST — רגוע, טבעי, sage ──────────────────────────────── */
      [data-palette="forest"] {
        --bg:          #0f1410;
        --bg-elev:     #18201a;
        --bg-card:     #1f2a21;
        --fg:          #e6ede7;
        --fg-dim:      #9fb0a3;
        --fg-muted:    #6c7d70;
        --border:      rgba(220,255,230,0.08);
        --border-str:  rgba(220,255,230,0.16);
        --accent:      #7fb685;
        --accent-hi:   #9bcfa0;
        --accent-soft: rgba(127,182,133,0.15);
        --bubble-user: #1d2a20;
        --bubble-agent:#19241e;
        --recording:   #ef6b6b;
        --thinking:    #d9b36b;
        --speaking:    #a8d5a2;
      }

      /* ── 3. PLUM — ייחודי, יוקרתי, לבנדר/סגול ──────────────────────── */
      [data-palette="plum"] {
        --bg:          #141019;
        --bg-elev:     #1d1726;
        --bg-card:     #261d31;
        --fg:          #ece6f2;
        --fg-dim:      #a99fb6;
        --fg-muted:    #756b82;
        --border:      rgba(235,225,255,0.08);
        --border-str:  rgba(235,225,255,0.16);
        --accent:      #b794f6;
        --accent-hi:   #c9aefc;
        --accent-soft: rgba(183,148,246,0.16);
        --bubble-user: #2a2138;
        --bubble-agent:#211b2e;
        --recording:   #ff5d8f;
        --thinking:    #a78bfa;
        --speaking:    #7fe0c8;
      }

      /* ── 4. TEAL — מודרני-טק, טורקיז ───────────────────────────────── */
      [data-palette="teal"] {
        --bg:          #0e1416;
        --bg-elev:     #16201f;
        --bg-card:     #1c2a29;
        --fg:          #e3edeb;
        --fg-dim:      #97aeac;
        --fg-muted:    #647d7a;
        --border:      rgba(220,255,250,0.08);
        --border-str:  rgba(220,255,250,0.16);
        --accent:      #2dd4bf;
        --accent-hi:   #5eead4;
        --accent-soft: rgba(45,212,191,0.15);
        --bubble-user: #173330;
        --bubble-agent:#152624;
        --recording:   #ff5a5a;
        --thinking:    #c98bff;
        --speaking:    #5eead4;
      }
    }

    @theme {
      --color-bg: var(--bg);
      --color-bg-elev: var(--bg-elev);
      --color-bg-card: var(--bg-card);
      --color-fg: var(--fg);
      --color-fg-dim: var(--fg-dim);
      --color-fg-muted: var(--fg-muted);
      --color-accent: var(--accent);
      --color-accent-hi: var(--accent-hi);
      --color-recording: var(--recording);
      --color-thinking: var(--thinking);
      --color-speaking: var(--speaking);
    }

    @layer base {
      html, body { height: 100dvh; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .chat-scroll {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        transition: scrollbar-color .3s;
      }
      .chat-scroll:hover { scrollbar-color: var(--border-str) transparent; }
      .chat-scroll::-webkit-scrollbar { width: 10px; }
      .chat-scroll::-webkit-scrollbar-track { background: transparent; }
      .chat-scroll::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: padding-box;
        transition: background .3s;
      }
      .chat-scroll:hover::-webkit-scrollbar-thumb { background: var(--border-str); background-clip: padding-box; }
      .chat-scroll::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); background-clip: padding-box; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--border-str); border-radius: 4px; }
      @keyframes pulse-rec {
        0%,100% { box-shadow: 0 0 0 0 var(--accent-soft); }
        50%     { box-shadow: 0 0 0 16px transparent; }
      }
      @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
      @keyframes spin { to { transform: rotate(360deg); } }
    }

    @layer components {
      .toggle {
        width: 44px; height: 26px; border-radius: 13px; flex-shrink: 0;
        background: var(--border-str); position: relative; transition: background .2s;
      }
      .toggle::after {
        content: ""; position: absolute; top: 3px; right: 3px;
        width: 20px; height: 20px; border-radius: 50%; background: var(--fg);
        transition: right .2s;
      }
      .toggle.on { background: var(--accent); }
      .toggle.on::after { right: calc(100% - 23px); }
      .mic-rec { background: var(--recording) !important; animation: pulse-rec 1.2s infinite; }
      .mic-speak { background: var(--speaking) !important; color: #111 !important; }

      /* sheet: ברירת מחדל שקוף (רק ידית). פתוח — רקע+מסגרת+צל מופיעים. */
      .app-sheet { background: transparent; border-top: 1px solid transparent; box-shadow: none; }
      .app-sheet.sheet-open {
        background: var(--bg-elev);
        border-top-color: var(--border);
        box-shadow: 0 -8px 24px rgba(0,0,0,.35);
      }
      .app-sheet .sheet-body { opacity: 0; transition: opacity .25s; pointer-events: none; }
      .app-sheet.sheet-open .sheet-body { opacity: 1; pointer-events: auto; }
      #sheet-grip:active { cursor: grabbing; }

      /* ── mic-card ──
         דסקטופ: כרטיס "עולה מלמטה" — פינות עליונות מעוגלות, פתוח-למטה,
                 רוחב מעט גדול מהבועות (max-w-3xl), רקע מוגבה + צל כלפי מעלה.
         מובייל (.mic-plain): לא כרטיס — fade מקצה-לקצה (רוחב מלא, gradient
                 שמתמזג לתוך ההודעות, בלי מסגרת/פינות/צל). */
      .mic-card {
        border-top-left-radius: 28px; border-top-right-radius: 28px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-bottom: none;
        box-shadow: 0 -10px 30px rgba(0,0,0,.28);
        transition: background .3s, box-shadow .3s, border-color .3s;
      }
      /* mic-card style נשלט ב-JS (setViewport):
         דסקטופ = כרטיס (class .mic-card נותן border/radius/shadow);
         מובייל = JS נותן gradient-bg (שקוף→bg-elev) על ה-card; footer שקוף. */
    }
  </style>
</head>

<body class="flex flex-col">

<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║  COMPONENT LIBRARY                                                ║
     ║  כל קומפוננטה חיה בתוך <template id="…"> משלה.                     ║
     ║  ה-id ממופה 1:1 לשם קובץ Svelte עתידי (ראו טבלה בתחתית הקובץ).     ║
     ║  הרכבה: <x-use ref="…">…slot…</x-use> (ראו <script> בתחתית).        ║
     ║  data-slot בתוך template = המקום שאליו נכנס תוכן ה-x-use.          ║
     ╚══════════════════════════════════════════════════════════════════╝ -->

<!-- ─────────────────────────── Avatar.svelte ───────────────────────────
     props: data-kind = user | agent | thought | tool
     הצבע/אייקון נבחרים לפי kind ב-x-use init (אייקונים inline למטה). -->
<template id="Avatar">
  <span class="avatar shrink-0 size-7 grid place-items-center rounded-full" data-slot></span>
</template>

<!-- ─────────────────────────── ChatBubble.svelte ───────────────────────
     בועת user/agent. data-variant = user | agent.
     user → self-start, פינה תחתונה-שמאל חדה. agent → self-end (flow RTL).
     slot = תוכן הבועה. -->
<template id="ChatBubble-user">
  <div class="flex gap-2 self-start max-w-[85%] items-end">
    <x-use ref="Avatar" data-kind="user"></x-use>
    <div class="px-3.5 py-2.5 rounded-2xl rounded-bl-sm text-sm leading-relaxed"
         style="background:var(--bubble-user)" data-slot></div>
  </div>
</template>
<template id="ChatBubble-agent">
  <div class="flex gap-2 self-end max-w-[85%] items-end flex-row-reverse">
    <x-use ref="Avatar" data-kind="agent"></x-use>
    <div class="px-3.5 py-2.5 rounded-2xl rounded-br-sm text-sm leading-relaxed"
         style="background:var(--bubble-agent)" data-slot></div>
  </div>
</template>

<!-- ─────────────────────────── ThoughtBubble.svelte ────────────────────
     C1 — מחשבת המודל כ*טקסט רץ* (לא הברה-בשורה). המוקאפ מראה את היעד;
     הבאג (chunks→segments) והתיקון מתועדים ב-redesign-vnext.md §C1.
     slot = גוף המחשבה. שורת תרגום עברי (אופציונלי) = opacity-50 מתחת.
     התרגום מגיע אסינכרונית (translateThoughts, slice 9a) — לא במוקאפ. -->
<template id="ThoughtBubble">
  <div class="flex gap-2 self-end max-w-[85%] items-end flex-row-reverse">
    <x-use ref="Avatar" data-kind="thought"></x-use>
    <div class="px-3.5 py-2.5 rounded-xl text-[13px] leading-relaxed italic border border-dashed"
         style="border-color:var(--border-str); color:var(--fg-dim)">
      <div class="text-[11px] font-semibold not-italic opacity-70 mb-1">מחשבה</div>
      <div data-slot></div>
    </div>
  </div>
</template>

<!-- ─────────────────────────── ToolBubble.svelte ───────────────────────
     C2 — כלים מרוכזים בצד המודל (self-end), לא רוחב מלא (היה stretch).
     קיבוץ + drill-down: סיכום → רשימת פעולות → לכל פעולה פקודה+תוצאה
     (שני <details> מקוננים בדמו). status dot: ירוק=הושלם, כתום-פועם=רץ.
     slot = תוכן הכרטיס. -->
<template id="ToolBubble">
  <div class="flex gap-2 self-end max-w-[78%] items-end flex-row-reverse w-full">
    <x-use ref="Avatar" data-kind="tool"></x-use>
    <div class="rounded-xl border overflow-hidden text-[13px]"
         style="background:var(--bg-card); border-color:var(--border)" data-slot></div>
  </div>
</template>

<!-- ─────────────────────────── SessionCard.svelte ──────────────────────
     כרטיס סשן ב-sidebar/sheet. data-variant = active | normal | new.
     slot = תוכן (כותרת + meta). -->
<template id="SessionCard-active">
  <button class="text-start rounded-lg p-2.5 text-[13px] border" style="background:var(--accent-soft); border-color:var(--accent)" data-slot></button>
</template>
<template id="SessionCard-normal">
  <button class="text-start rounded-lg p-2.5 text-[13px] hover:bg-white/[0.03]" style="background:var(--bg-card)" data-slot></button>
</template>

<!-- ─────────────────────────── RefreshIcon (אייקון משותף) ──────────────── -->
<template id="RefreshIcon">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
</template>

<!-- ─────────────────────────── AppHeader.svelte ────────────────────────
     A3: floating header. fade חזק: gradient ארוך + mask, ההודעות "נמסות" מתחתיו.
     מבנה: [המבורגר (דסקטופ בלבד)] [שם+מחובר+cwd] ··· [הגדרות] -->
<template id="AppHeader">
  <header class="absolute top-0 inset-x-0 z-20 flex items-start gap-3 px-4 pt-3 pb-8 pointer-events-none">
    <!-- fade layer -->
    <div class="absolute inset-0 -z-10 backdrop-blur-sm"
         style="background:linear-gradient(to bottom, var(--bg) 0%, color-mix(in srgb, var(--bg) 55%, transparent) 55%, transparent 100%);
                -webkit-mask-image:linear-gradient(to bottom, #000 60%, transparent); mask-image:linear-gradient(to bottom, #000 60%, transparent)"></div>

    <!-- המבורגר — דסקטופ בלבד (במובייל יש bottom-sheet במקומו) -->
    <button id="hdr-menu" class="pointer-events-auto size-9 grid place-items-center rounded-lg text-[var(--fg-dim)] hover:bg-white/5 hover:text-[var(--fg)] shrink-0"
            onclick="openSheet()" aria-label="תפריט">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- spacer שמאל (תופס מקום של ההמבורגר) כדי לאזן את הכותרת -->
    <div class="flex-1"></div>

    <!-- כותרת ממורכזת אבסולוטית; שם התיקייה (chip) מימין לה (RTL → ראשון ב-DOM). -->
    <div id="hdr-title" class="absolute left-1/2 -translate-x-1/2 top-3 h-9 flex items-center justify-center gap-2.5 pointer-events-none max-w-[70%]">
      <span class="hdr-cwd inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-mono shrink-0"
            style="background:var(--bg-card); border:1px solid var(--border)" dir="ltr" title="/home/user">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fg-muted)"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
        <span class="font-semibold" style="color:var(--fg)">user</span>
      </span>
      <span class="text-[15px] font-semibold shrink-0">voice-acp</span>
    </div>

    <!-- סטטוס: נקודה בלבד כשמחובר (טקסט מיותר). title ל-hover. -->
    <span class="pointer-events-auto shrink-0 grid place-items-center size-9" title="מחובר">
      <span class="size-2.5 rounded-full" style="background:var(--speaking); box-shadow:0 0 8px var(--speaking)"></span>
    </span>

    <!-- הגדרות -->
    <button class="pointer-events-auto size-9 grid place-items-center rounded-lg text-[var(--fg-dim)] hover:bg-white/5 hover:text-[var(--fg)] shrink-0"
            data-screen="settings" aria-label="הגדרות">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
</template>

<!-- ─────────────────────────── Sidebar.svelte ──────────────────────────
     דסקטופ בלבד. אפשרויות סוכן + רשימת סשנים. -->
<template id="Sidebar">
  <aside class="app-sidebar flex flex-col w-72 shrink-0 border-s overflow-hidden pt-16 pb-4 px-3 gap-4 transition-all duration-300"
         style="border-color:var(--border); background:var(--bg-elev)">
    <!-- כותרת + קיפול -->
    <div class="flex items-center justify-end shrink-0">
      <button onclick="toggleSidebar()" class="size-7 grid place-items-center rounded-lg text-[var(--fg-dim)] hover:bg-white/5 hover:text-[var(--fg)]" title="קפל פאנל">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="flex flex-col gap-2.5">
      <div class="text-[11px] font-semibold uppercase tracking-wider text-[var(--fg-muted)] px-1">אפשרויות סוכן</div>

<!-- ════════════════════ x-use — ספריית ההרכבה הזעירה ════════════════════
     זה הקוד היחיד שלא יעבור ל-Svelte (Svelte עושה את זה מובנה).
     מה הוא עושה:
       <x-use ref="ID">slot…</x-use>  →  clone של <template id="ID">,
       התוכן של ה-x-use מוזרק ל-[data-slot] שבתוך ה-template.
     attributes (class/style/data-*) על ה-x-use מועתקים לאלמנט-השורש המוחזר.
     ההרכבה רקורסיבית: x-use בתוך template מורכב גם הוא (connectedCallback). -->
<script>
  class XUse extends HTMLElement {
    connectedCallback() {
      const tpl = document.getElementById(this.getAttribute('ref'));
      if (!tpl) { console.error('x-use: no template', this.getAttribute('ref')); return; }
      const frag = tpl.content.cloneNode(true);
      const root = frag.firstElementChild;

      // slot: התוכן שבין תגי ה-x-use נכנס לאלמנט עם [data-slot]
      const slotHost = frag.querySelector('[data-slot]');
      if (slotHost && this.childNodes.length) {
        while (this.firstChild) slotHost.appendChild(this.firstChild);
        slotHost.removeAttribute('data-slot');
      }

      // attribute passthrough: class/style/data-* מה-x-use → אל root
      if (root) {
        for (const { name, value } of [...this.attributes]) {
          if (name === 'ref') continue;
          if (name === 'class') root.setAttribute('class', ((root.getAttribute('class') || '') + ' ' + value).trim());
          else if (name === 'style') root.setAttribute('style', (root.getAttribute('style') || '') + ';' + value);
          else root.setAttribute(name, value);
        }
      }
      this.replaceWith(frag);
    }
  }
  customElements.define('x-use', XUse);
</script>

<!-- ════════════════════ DEMO INTERACTIONS ════════════════════
     לוגיקת הדמו (palette/screen/mode/viewport/sheet). זהה למקור. -->
<script>
  const html = document.documentElement;
  let mode = 'idle';

  function setPalette(p) {
    html.dataset.palette = p;
    document.querySelectorAll('#palette-bar button').forEach(b =>
      b.style.cssText = b.dataset.palette === p
        ? 'background:var(--accent);color:#fff'
        : 'background:rgba(255,255,255,.08);color:var(--fg-dim)');
  }
  document.querySelectorAll('#palette-bar button').forEach(b =>
    b.onclick = () => setPalette(b.dataset.palette));

  function setScreen(s) {
    document.querySelectorAll('[data-view]').forEach(v =>
      v.classList.toggle('hidden', v.dataset.view !== s));
    document.querySelectorAll('[data-view]').forEach(v => {
      if (v.dataset.view === s) v.classList.add('flex');
    });
    document.querySelectorAll('#screen-bar button').forEach(b =>
      b.style.cssText = b.dataset.screen === s
        ? 'background:var(--accent);color:#fff'
        : 'background:rgba(255,255,255,.08);color:var(--fg-dim)');
    document.getElementById('mode-bar').style.opacity = s === 'main' ? '1' : '0.35';
  }
  document.querySelectorAll('[data-screen]').forEach(b =>
    b.addEventListener('click', () => setScreen(b.dataset.screen)));

  // אייקוני ה-mic כ-SVG (Lucide-style) — יוחלפו בספריית האייקונים הנבחרת.
  const SVG = (p) => `<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const micCfg = {
    idle:      { icon: SVG('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>'), text:'לחצו על הכפתור כדי לדבר', cls:'' },
    recording: { icon: SVG('<rect x="6" y="6" width="12" height="12" rx="2"/>'), text:'מקליט…', cls:'mic-rec' },
    speaking:  { icon: SVG('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'), text:'מקריא תשובה…', cls:'mic-speak' },
  };
  function setMode(m) {
    mode = m;
    const recArea = document.getElementById('record-area');
    const typeArea = document.getElementById('type-area');
    const isType = m === 'typing';
    const showEl = isType ? typeArea : recArea;
    const hideEl = isType ? recArea : typeArea;
    if (hideEl.classList.contains('hidden') === false) {
      hideEl.style.opacity = '0';
      setTimeout(() => hideEl.classList.add('hidden'), 200);
    }
    showEl.classList.remove('hidden');
    showEl.classList.add('flex');
    requestAnimationFrame(() => { showEl.style.opacity = '1'; });
    document.getElementById('tg-record').style.cssText = !isType
      ? 'background:var(--accent);color:#fff' : 'color:var(--fg-dim)';
    document.getElementById('tg-type').style.cssText = isType
      ? 'background:var(--accent);color:#fff' : 'color:var(--fg-dim)';
    if (!isType) {
      const c = micCfg[m] || micCfg.idle;
      const btn = document.getElementById('mic-btn');
      btn.innerHTML = c.icon;
      btn.className = 'size-[110px] grid place-items-center rounded-full text-white transition-all duration-300 active:scale-95 ' + c.cls;
      if (!c.cls) btn.style.background = 'var(--accent)';
      document.getElementById('status-text').textContent = c.text;
      const stop = document.getElementById('stop-btn');
      const showStop = m === 'speaking';
      stop.classList.toggle('opacity-0', !showStop);
      stop.classList.toggle('pointer-events-none', !showStop);
    }
    document.querySelectorAll('#mode-bar button').forEach(b =>
      b.style.cssText = b.dataset.mode === m
        ? 'background:var(--accent);color:#fff'
        : 'background:rgba(255,255,255,.08);color:var(--fg-dim)');
    requestAnimationFrame(positionChatFade);
  }
  function cycleMic() {
    const order = ['idle','recording','speaking'];
    setMode(order[(order.indexOf(mode)+1) % order.length]);
  }
  document.querySelectorAll('#mode-bar button').forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));

  let isMobile = false;
  function setViewport(vp) {
    const shell = document.getElementById('app-shell');
    const aside = document.querySelector('.app-sidebar');
    const sheet = document.querySelector('.app-sheet');
    const hdrMenu = document.getElementById('hdr-menu');
    const hdrTitle = document.getElementById('hdr-title');
    const micFade = document.querySelector('.mic-fade');
    const micCard = document.querySelector('.mic-card');
    isMobile = vp === 'mobile';
    if (isMobile) {
      // מובייל: shell צר, sidebar מוסתר, sheet נמשך מוצג, המבורגר מוסתר,
      // mic = footer פשוט (לא כרטיס).
      shell.style.maxWidth = '440px';
      shell.classList.add('mic-plain');
      aside.style.display = 'none';
      sheet.style.display = 'flex';
      hdrMenu.style.display = 'none';
      // מובייל: mic flat. ה-fade על ה-FOOTER (רוחב מלא מקצה-לקצה, gradient
      // ארוך שמתחיל גבוה כדי שהמעבר מההודעות יהיה רך). ה-card שקוף לגמרי.
      if (micFade) micFade.style.display = 'none';
      if (micCard) micCard.style.cssText =
        'border:none;border-radius:0;box-shadow:none;background:transparent;max-width:100%';
      const ftr = micCard ? micCard.closest('footer') : null;
      // ה-footer ברקע bg אטום (אותו צבע כמו הצ'אט). ה-fade עצמו נעשה ע"י
      // overlay #chat-fade שמעל אזור הגלילה — ההודעות נמוגות מתחתיו.
      if (ftr) ftr.style.cssText = 'background:var(--bg)';
      document.body.style.background = '#000';
    } else {
      // דסקטופ: shell על כל המסך, mic = כרטיס עולה-מלמטה (הבועות מוגבלות ל-2xl)
      shell.style.maxWidth = '100%';
      shell.classList.remove('mic-plain');
      aside.style.display = 'flex';
      sheet.style.display = 'none';
      hdrMenu.style.display = 'grid';
      // דסקטופ: mic = כרטיס (מאפסים inline כדי שה-class .mic-card יחזור לשלוט)
      if (micFade) micFade.style.display = 'none';
      if (micCard) micCard.style.cssText = '';
      const ftr = micCard ? micCard.closest('footer') : null;
      if (ftr) ftr.style.cssText = '';
      document.body.style.background = '';
      closeSheet();
      applySidebar();
    }
    document.querySelectorAll('#viewport-bar button').forEach(b =>
      b.style.cssText = b.dataset.vp === vp
        ? 'background:var(--accent);color:#fff'
        : 'background:rgba(255,255,255,.08);color:var(--fg-dim)');
    requestAnimationFrame(positionChatFade);
  }
  document.querySelectorAll('#viewport-bar button').forEach(b =>
    b.onclick = () => setViewport(b.dataset.vp));



  // ── sidebar collapse (דסקטופ) — קיפול לרוחב 0; ההמבורגר פותח בחזרה ──
  let sidebarCollapsed = false;
  function applySidebar() {
    const aside = document.querySelector('.app-sidebar');
    if (isMobile) return;
    if (sidebarCollapsed) {
      aside.style.width = '0px';
      aside.style.paddingInline = '0px';
      aside.style.opacity = '0';
      aside.style.pointerEvents = 'none';
    } else {
      aside.style.width = '18rem'; /* w-72 */
      aside.style.paddingInline = '';
      aside.style.opacity = '1';
      aside.style.pointerEvents = '';
    }
  }
  function toggleSidebar() { sidebarCollapsed = !sidebarCollapsed; applySidebar(); }

  // peek = רואים את הידית בתחתית; open = הפאנל מלא; transform inline בלבד
  // (לא class) כדי שהפתיחה תגבר בוודאות.
  const SHEET_PEEK = 'translateY(calc(100% - 1.75rem))';
  let sheetOpen = false;
  function openSheet() {
    // בדסקטופ: ההמבורגר פותח את ה-sidebar המקופל. במובייל: פותח את ה-sheet.
    if (!isMobile) { if (sidebarCollapsed) toggleSidebar(); return; }
    sheetOpen = true;
    const s = document.getElementById('sheet');
    s.style.transform = 'translateY(0)';
    s.classList.add('sheet-open');
    document.getElementById('sheet-backdrop').classList.remove('hidden');
  }
  function closeSheet() {
    sheetOpen = false;
    const s = document.getElementById('sheet');
    s.style.transform = SHEET_PEEK;
    s.classList.remove('sheet-open');
    document.getElementById('sheet-backdrop').classList.add('hidden');
  }
  function toggleSheet() { sheetOpen ? closeSheet() : openSheet(); }

  // ── sheet drag (מגע/עכבר על הידית) — משיכה למעלה פותחת, למטה סוגרת ──
  (function () {
    const grip = document.getElementById('sheet-grip');
    const sheet = document.getElementById('sheet');
    let dragging = false, startY = 0, moved = 0;
    function down(e) { if (!isMobile) return; dragging = true; moved = 0;
      startY = (e.touches ? e.touches[0] : e).clientY;
      sheet.style.transition = 'none'; e.preventDefault(); }
    function move(e) { if (!dragging) return;
      const y = (e.touches ? e.touches[0] : e).clientY;
      moved = y - startY;
      const base = sheetOpen ? 0 : sheet.offsetHeight - 28;
      let off = Math.max(0, base + moved);
      sheet.style.transform = `translateY(${off}px)`;
      if (moved < -20) sheet.classList.add('sheet-open');
    }
    function up() { if (!dragging) return; dragging = false;
      sheet.style.transition = '';
      if (moved < -40) openSheet(); else if (moved > 40) closeSheet();
      else sheetOpen ? openSheet() : closeSheet();
    }
    grip.addEventListener('mousedown', down);
    grip.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    grip.addEventListener('click', () => { if (Math.abs(moved) < 5) toggleSheet(); });
  })();

  document.querySelectorAll('.toggle').forEach(t =>
    t.parentElement.addEventListener('click', e => { e.preventDefault(); t.classList.toggle('on'); }));

  // ── chat-fade: ממקם את ה-overlay בדיוק מעל ה-footer (גובה footer משתנה) ──
  function positionChatFade() {
    const fade = document.getElementById('chat-fade');
    const ftr = document.querySelector('footer');
    if (!fade || !ftr) return;
    // bottom של ה-fade = גובה ה-footer, כך שהוא יושב בתחתית אזור הגלילה.
    fade.style.bottom = ftr.offsetHeight + 'px';
  }

  // ── demo-bar drag (עכבר + מגע) — לגרור את שורת הכפתורים הצידה ──
  (function () {
    const bar = document.getElementById('demo-bar');
    const grip = document.getElementById('demo-grip');
    let dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0;
    function currentPos() {
      const r = bar.getBoundingClientRect();
      return { x: r.left, y: r.top };
    }
    function down(e) {
      dragging = true;
      grip.style.cursor = 'grabbing';
      const p = currentPos();
      baseX = p.x; baseY = p.y;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
      bar.style.transform = 'none';
      bar.style.left = baseX + 'px';
      bar.style.top = baseY + 'px';
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - startX, dy = pt.clientY - startY;
      let nx = baseX + dx, ny = baseY + dy;
      nx = Math.max(0, Math.min(window.innerWidth - bar.offsetWidth, nx));
      ny = Math.max(0, Math.min(window.innerHeight - bar.offsetHeight, ny));
      bar.style.left = nx + 'px';
      bar.style.top = ny + 'px';
    }
    function up() { dragging = false; grip.style.cursor = 'grab'; }
    grip.addEventListener('mousedown', down);
    grip.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();

  // Avatar: צבע+אייקון לפי data-kind. רץ אחרי ההרכבה.
  const avatarCfg = {
    user:    { bg:'color-mix(in srgb, var(--accent) 18%, transparent)',  fg:'var(--accent-hi)', icon:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
    agent:   { bg:'color-mix(in srgb, var(--accent) 22%, transparent)',  fg:'var(--accent-hi)', icon:'<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>' },
    thought: { bg:'color-mix(in srgb, var(--thinking) 15%, transparent)', fg:'var(--thinking)',  icon:'<path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>' },
    tool:    { bg:'color-mix(in srgb, var(--accent) 15%, transparent)',  fg:'var(--accent-hi)', icon:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' },
  };
  document.querySelectorAll('.avatar[data-kind]').forEach(a => {
    const c = avatarCfg[a.dataset.kind] || avatarCfg.user;
    a.style.background = c.bg;
    a.style.color = c.fg;
    a.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>`;
  });

  // init
  setPalette('ember');
  setViewport('desktop');
  setScreen('main');
  setMode('idle');
</script>
