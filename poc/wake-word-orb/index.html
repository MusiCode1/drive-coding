<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wake Word — Voice Orb POC (DOM vs Canvas)</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
      margin: 0; min-height: 100vh; padding: 2rem 1rem;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    h1 { font-size: 1.3rem; margin: 0; }
    .sub { opacity: 0.6; font-size: 0.85rem; margin-top: -1rem; text-align: center; }
    button {
      font-size: 1rem; padding: 0.7rem 1.5rem; border: 0; border-radius: 0.6rem;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { font-size: 0.9rem; opacity: 0.85; min-height: 1.2em; }

    /* Two orbs side by side */
    .orbs { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; align-items: center; }
    .orb-cell { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .orb-cell .label { font-size: 0.8rem; opacity: 0.6; }
    .orb-stage {
      width: 300px; height: 300px; display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* DOM orb styles */
    .orb-dom-root { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    .orb-dom-core {
      width: 90px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6);
      transition: width 0.08s linear, height 0.08s linear, background 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 0 30px rgba(59,130,246,0.5);
    }
    .orb-dom-core.speaking {
      background: radial-gradient(circle at 35% 35%, #86efac, #22c55e);
      box-shadow: 0 0 45px rgba(34,197,94,0.7);
    }
    .orb-dom-ring {
      position: absolute; width: 0; height: 0; border-radius: 50%;
      border: 4px dashed transparent; transition: width 0.2s, height 0.2s, border-color 0.2s;
    }
    .orb-dom-ring.active {
      width: 240px; height: 240px; border-color: rgba(248,113,113,0.9);
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orb-dom-flash {
      position: absolute; width: 90px; height: 90px; border-radius: 50%;
      pointer-events: none; opacity: 0;
    }
    .orb-dom-flash.fire { animation: flashpulse 0.45s ease-out; }
    @keyframes flashpulse {
      0%   { opacity: 0.9; transform: scale(1);   box-shadow: 0 0 0 0 rgba(255,255,255,0.9); }
      100% { opacity: 0;   transform: scale(2.4); box-shadow: 0 0 0 40px rgba(255,255,255,0); }
    }

    canvas { display: block; }

    /* Capture + clips */
    #capture { padding: 1rem; border: 1px solid #30363d; border-radius: 0.6rem; width: min(40rem, 92vw); }
    #capture h3 { margin-top: 0; font-size: 1rem; }
    .cap-controls { font-size: 0.85rem; margin: 0.5rem 0; }
    .clip { margin: 0.5rem 0; padding: 0.5rem; background: rgba(255,255,255,0.04); border-radius: 0.4rem; }
    .clip p { margin: 0 0 0.3rem; font-size: 0.8rem; opacity: 0.7; }
    .clip a { color: #60a5fa; margin-inline-start: 0.5rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Voice Orb — DOM vs Canvas</h1>
  <p class="sub">Size = loudness · Color = speaking (VAD) · Red ring = capturing · Flash = wake word.<br />Say "hey jarvis" to start a capture, "hey jarvis" again to stop.</p>

  <button id="toggle" disabled>Loading models…</button>
  <div id="status">…</div>

  <div class="orbs">
    <div class="orb-cell">
      <div class="label">DOM / CSS</div>
      <div class="orb-stage"><div id="orb-dom"></div></div>
    </div>
    <div class="orb-cell">
      <div class="label">Canvas</div>
      <div class="orb-stage"><canvas id="orb-canvas" width="300" height="300"></canvas></div>
    </div>
  </div>

  <div id="capture">
    <h3>🎙️ Recordings</h3>
    <p id="cap-status">idle</p>
    <div class="cap-controls">
      <label for="cap-trim">Trim trailing frames:</label>
      <input type="number" id="cap-trim" value="16" min="0" max="60" style="width:4rem;" />
      <span style="opacity:0.6;">(16 ≈ 1.28s)</span>
    </div>
    <div id="cap-clips"></div>
  </div>

  <!-- onnxruntime-web (WASM) loaded globally; the lib uses window.ort -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.22.0/ort.wasm.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
